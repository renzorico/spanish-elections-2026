# GitHub Pages is the BACKUP address of the site (the main one is https://compara29n.vercel.app/).
# It runs the full test suite and data validation first; a failing check blocks deployment.
# Then it decides what to serve: if the Vercel site answers, this address only redirects to it
# (keeping ?lang and #… parts); if not, it serves the full site so nothing goes dark.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test (matching, data validation, UI neutrality checks)
        run: npm test

      - name: Validate data and build bundle
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Choose what GitHub Pages serves
        run: |
          mkdir _pages
          if curl -fsS --max-time 20 https://compara29n.vercel.app/data/bundle.json | grep -q '"election"'; then
            echo "The new site is live: this address will redirect to it."
            cp -r redirect/. _pages/
          else
            echo "The new site is not reachable: this address keeps serving the full site."
            cp -r site/. _pages/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
