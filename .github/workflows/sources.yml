# Weekly check that every cited source URL still resolves. Not part of the deploy gate
# (external sites can be flaky); a failure here means a source needs replacing or reviewing.
name: Check sources

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check-sources
